name: Release move-flow

on:
  push:
    tags:
      - 'move-flow-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.4). Looks for move-flow-v{version} in aptos-core.'
        required: true
        type: string
      aptos_core_ref:
        description: 'Override aptos-core ref (default: move-flow-v{version})'
        required: false
        type: string
      dry_run:
        description: 'Build artifacts but do not create a GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      aptos_core_ref: ${{ steps.resolve.outputs.aptos_core_ref }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve tag, version, aptos-core ref
        id: resolve
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.aptos_core_ref }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
            TAG="move-flow-v${VERSION}"
          else
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#move-flow-v}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::move-flow version '$VERSION' must be MAJOR.MINOR.PATCH."
            exit 1
          fi

          REF="${INPUT_REF:-move-flow-v${VERSION}}"
          if [ "${INPUT_DRY_RUN:-false}" != "true" ] && [ "$REF" != "move-flow-v${VERSION}" ]; then
            echo "::error::Real releases must build from move-flow-v${VERSION}; aptos_core_ref overrides are dry-run only."
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "aptos_core_ref=$REF"
            echo "dry_run=${INPUT_DRY_RUN:-false}"
          } >> "$GITHUB_OUTPUT"

          MATRIX=$(cat <<'JSON'
          [
            {"name":"macOS Intel",      "runner":"macos-15-intel",   "target":"x86_64-apple-darwin"},
            {"name":"macOS ARM",        "runner":"macos-latest",     "target":"aarch64-apple-darwin"},
            {"name":"Linux x86",        "runner":"ubuntu-24.04",     "target":"x86_64-unknown-linux-gnu"},
            {"name":"Linux ARM",        "runner":"ubuntu-24.04-arm", "target":"aarch64-unknown-linux-gnu"},
            {"name":"Linux x86 compat", "runner":"ubuntu-latest",    "target":"x86_64-unknown-linux-gnu",  "compat":true, "container":"ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214"},
            {"name":"Linux ARM compat", "runner":"ubuntu-24.04-arm", "target":"aarch64-unknown-linux-gnu", "compat":true, "container":"ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214"},
            {"name":"Windows x86",      "runner":"windows-2025",     "target":"x86_64-pc-windows-msvc"}
          ]
          JSON
          )
          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.matrix) }}

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}

    env:
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
      APTOS_CORE_REF: ${{ needs.check.outputs.aptos_core_ref }}

    steps:
      - name: Install container prerequisites
        if: matrix.container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y curl ca-certificates git sudo
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Checkout release repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout aptos-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: aptos-labs/aptos-core
          ref: ${{ env.APTOS_CORE_REF }}
          path: aptos-core
          fetch-depth: 1
          persist-credentials: false

      - name: Validate aptos-core source version
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(awk -F'"' '/^\[/{s=$0} s=="[package]" && /^version *=/ {print $2; exit}' \
            aptos-core/aptos-move/flow/Cargo.toml)"
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "::error::aptos-core source version '$SOURCE_VERSION' does not match release version '$VERSION'."
            exit 1
          fi

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: bash .github/workflows/build-scripts/setup-linux.sh

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config openssl cmake llvm lld
          OPENSSL_PREFIX="$(brew --prefix openssl)"
          echo "OPENSSL_DIR=${OPENSSL_PREFIX}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${OPENSSL_PREFIX}/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Windows build deps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = 'C:\vcpkg\'
          vcpkg install openssl:x64-windows-static-md --clean-after-build
          "VCPKG_ROOT=C:\vcpkg\"                                 | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_STATIC=1"                                     | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Read Rust toolchain version
        id: rust-version
        shell: bash
        run: |
          CHANNEL=$(grep '^channel' aptos-core/rust-toolchain.toml | sed 's/.*"\(.*\)"/\1/')
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Using Rust toolchain: $CHANNEL"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable branch @ 2026-05
        with:
          toolchain: ${{ steps.rust-version.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: aptos-core -> target
          key: release-${{ matrix.target }}${{ matrix.compat && '-compat' || '' }}

      - name: Patch CPU baseline for x86 compat
        if: matrix.compat && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cd aptos-core
          sed -i 's/target-cpu=x86-64-v3/target-cpu=x86-64-v2/g' .cargo/config.toml
          sed -i 's/-march=x86-64-v3/-march=x86-64/g' .cargo/config.toml
          echo "Patched .cargo/config.toml for x86-64-v2 compat"

      - name: Build move-flow
        working-directory: aptos-core
        shell: bash
        run: |
          cargo build \
            -p aptos-move-flow \
            --bin move-flow \
            --target ${{ matrix.target }} \
            --profile cli

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        env:
          COMPAT: ${{ matrix.compat }}
          TARGET: ${{ matrix.target }}
        run: |
          SUFFIX=""
          if [ "$COMPAT" = "true" ]; then
            SUFFIX="-compat"
          fi
          ARCHIVE="move-flow-v${VERSION}-${TARGET}${SUFFIX}.zip"
          cd "aptos-core/target/${TARGET}/cli"
          zip "${GITHUB_WORKSPACE}/${ARCHIVE}" move-flow
          echo "Packaged: ${ARCHIVE}"

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $Archive = "move-flow-v${env:VERSION}-${env:TARGET}.zip"
          Compress-Archive `
            -Path "aptos-core\target\${env:TARGET}\cli\move-flow.exe" `
            -DestinationPath $Archive
          Write-Output "Packaged: $Archive"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: move-flow-${{ matrix.target }}${{ matrix.compat && '-compat' || '' }}
          path: '*.zip'
          if-no-files-found: error

  generate-plugin:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      # This job runs the release binary, so keep it credential-free.
      - name: Download Linux x86 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: move-flow-x86_64-unknown-linux-gnu
          path: plugin-bin

      - name: Generate plugin tree
        run: |
          set -euo pipefail
          cd plugin-bin
          unzip -o "move-flow-v${VERSION}-x86_64-unknown-linux-gnu.zip"
          chmod +x ./move-flow
          ./move-flow plugin "${RUNNER_TEMP}/plugin"
          test -f "${RUNNER_TEMP}/plugin/.claude-plugin/plugin.json"

      - name: Upload generated plugin tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: move-flow-plugin-tree
          path: ${{ runner.temp }}/plugin
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [check, build, generate-plugin]
    if: needs.check.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
      APTOS_CORE_REF: ${{ needs.check.outputs.aptos_core_ref }}
    steps:
      - name: Checkout release repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: move-flow-*-*-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum move-flow-v*.zip > SHA256SUMS

      - name: Extract changelog section
        id: changelog
        run: |
          set -euo pipefail
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              /^## \[/ {
                if (found) exit
                if (index($0, "[" ver "]")) { found=1; next }
              }
              found { print }
            ' CHANGELOG.md > release_notes_section.md
          else
            : > release_notes_section.md
          fi

          if [ ! -s release_notes_section.md ]; then
            echo "_No changelog entry found for ${VERSION} — see commit history._" > release_notes_section.md
          fi

      - name: Build release body
        run: |
          set -euo pipefail
          {
            echo "## move-flow ${VERSION}"
            echo ""
            echo "Built from [aptos-core \`${APTOS_CORE_REF}\`](https://github.com/aptos-labs/aptos-core/tree/${APTOS_CORE_REF}/aptos-move/flow)."
            echo ""
            echo "### What's Changed"
            echo ""
            cat release_notes_section.md
            echo ""
            echo "### Install"
            echo ""
            echo '```bash'
            echo "# Unix (Linux + macOS)"
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh"
            echo ""
            echo "# Windows (PowerShell)"
            echo "irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.ps1 | iex"
            echo '```'
            echo ""
            echo "### Downloads"
            echo ""
            echo "| Platform | Archive | SHA-256 |"
            echo "|----------|---------|---------|"
            cd artifacts
            for zip in move-flow-v*.zip; do
              HASH=$(sha256sum "$zip" | cut -d' ' -f1)
              SHORT="${HASH:0:16}…"
              case "$zip" in
                *x86_64-apple-darwin*)      PLATFORM="macOS x86_64 (Intel)" ;;
                *aarch64-apple-darwin*)     PLATFORM="macOS ARM64 (Apple Silicon)" ;;
                *x86_64*linux*compat*)      PLATFORM="Linux x86_64 (compat — older glibc / Docker-on-Mac)" ;;
                *aarch64*linux*compat*)     PLATFORM="Linux ARM64 (compat — older glibc)" ;;
                *x86_64*linux*)             PLATFORM="Linux x86_64" ;;
                *aarch64*linux*)            PLATFORM="Linux ARM64" ;;
                *x86_64*windows*)           PLATFORM="Windows x86_64" ;;
                *)                          PLATFORM="$zip" ;;
              esac
              echo "| $PLATFORM | \`$zip\` | \`$SHORT\` |"
            done
            cd ..
            echo ""
            echo "### Verification"
            echo ""
            echo '```bash'
            echo "sha256sum -c SHA256SUMS"
            echo '```'
          } > release_body.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            artifacts/move-flow-v*.zip
            artifacts/SHA256SUMS

      - name: Determine pre-release status
        id: prerelease
        run: |
          if echo "$TAG" | grep -qE '-(rc|beta|alpha|test)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: move-flow ${{ env.VERSION }}
          prerelease: ${{ steps.prerelease.outputs.prerelease == 'true' }}
          body_path: release_body.md
          files: |
            artifacts/move-flow-v*.zip
            artifacts/SHA256SUMS

  publish-plugin:
    needs: [check, generate-plugin, release]
    if: needs.check.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment: move-flow-merger
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
      APTOS_CORE_REF: ${{ needs.check.outputs.aptos_core_ref }}
    steps:
      - name: Gate on GitHub App credentials
        env:
          APP_ID: ${{ vars.APTOS_AI_PLUGIN_PUBLISHER_APP_ID }}
          APP_KEY: ${{ secrets.APTOS_AI_PLUGIN_PUBLISHER_APP_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::aptos-ai plugin publisher GitHub App is not configured."
            exit 1
          fi

      - name: Generate aptos-ai token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APTOS_AI_PLUGIN_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.APTOS_AI_PLUGIN_PUBLISHER_APP_KEY }}
          owner: aptos-labs
          repositories: aptos-ai
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve App bot identity
        id: committer
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Checkout release repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Download generated plugin tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: move-flow-plugin-tree
          path: generated-plugin

      - name: Sync generated plugin tree
        run: |
          set -euo pipefail
          rm -rf plugins/move-flow
          mkdir -p plugins/move-flow
          cp -R generated-plugin/. plugins/move-flow/

      - name: Open or update plugin PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMITTER_NAME: ${{ steps.committer.outputs.name }}
          COMMITTER_EMAIL: ${{ steps.committer.outputs.email }}
        run: |
          set -euo pipefail
          git config user.name  "$COMMITTER_NAME"
          git config user.email "$COMMITTER_EMAIL"

          BRANCH="move-flow/v${VERSION}"
          REMOTE_BRANCH="refs/heads/${BRANCH}"
          REMOTE_TRACKING_BRANCH="refs/remotes/origin/${BRANCH}"
          LEASE="${REMOTE_BRANCH}:"
          if git fetch origin "+${REMOTE_BRANCH}:${REMOTE_TRACKING_BRANCH}" 2>/dev/null; then
            LEASE="${REMOTE_BRANCH}:$(git rev-parse "${REMOTE_TRACKING_BRANCH}")"
          fi

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open \
            --json url,isCrossRepository \
            --jq 'map(select(.isCrossRepository == false)) | .[0].url // empty' 2>/dev/null || true)

          git checkout -B "$BRANCH"
          git add plugins/move-flow/
          if git diff --cached --quiet; then
            echo "Plugin already up to date."
            exit 0
          fi

          git commit \
            -m "Update move-flow plugin to v${VERSION}" \
            -m "Generated from aptos-core ${APTOS_CORE_REF}."
          git push -u origin "$BRANCH" --force-with-lease="$LEASE"

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Update move-flow plugin to v${VERSION}" \
              --body "Regenerated move-flow plugin from aptos-core \`${APTOS_CORE_REF}\` (v${VERSION})."
          else
            echo "Updated existing PR: $EXISTING_PR"
          fi
